server {
    listen       80;
    server_name  localhost;
    
    # Point to where your HTML files live inside the container
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        # THE MAGIC TRICK: 
        # 1. Try the exact name ($uri)
        # 2. Try adding .html ($uri.html)
        # 3. Try looking for a folder ($uri/)
        # 4. If all fail, throw a 404
        try_files $uri $uri/ $uri.html =404;
    }
}
