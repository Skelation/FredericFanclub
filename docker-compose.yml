version: '3.8'

services:
  # --- THE GO BACKEND (now serves frontend files too) ---
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fred-live
    ports:
      - "80:3000"
    env_file:
      - ./server/.env.prod
    environment:
      - FRONTEND_DIR=/app/frontend
    volumes:
      - ./server/database:/app/database
      - ./server/data:/app/data
      - ./frontend:/app/frontend:ro
    restart: unless-stopped
    networks:
      - fred_network

networks:
  fred_network:
    driver: bridge
