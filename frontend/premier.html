<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier Tracker | Frederic Fanclub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Specific styles for the Premier Split-Screen Layout */
        .premier-container { 
            display: flex; 
            gap: 20px; 
            margin-top: 20px;
            min-height: 600px;
        }
        
        /* Left Panel: Match List */
        .match-list-panel { 
            flex: 1; 
            background: rgba(17, 17, 17, 0.8); 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            overflow-y: auto; 
            padding: 15px; 
            max-height: 800px;
        }
        .match-card { 
            background: rgba(34, 34, 34, 0.8); 
            padding: 15px; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            border-left: 4px solid #444; 
            transition: 0.2s; 
        }
        .match-card:hover { background: rgba(51, 51, 51, 0.9); border-color: #00d4ff; }
        .match-card.active { border-color: #ffaa00; background: rgba(42, 42, 42, 0.9); }
        
        /* Right Panel: Scoreboard */
        .scoreboard-panel { 
            flex: 2; 
            background: rgba(17, 17, 17, 0.8); 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 20px; 
            overflow-y: auto; 
            display: none; 
            max-height: 800px;
        }
        
        .sb-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; }
        .sb-score { font-size: 3rem; font-family: 'Orbitron', sans-serif; font-weight: bold; }

        .team-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-family: 'Rajdhani', sans-serif; }
        .team-table th { text-align: left; padding: 10px; font-family: 'Orbitron', sans-serif; color: #888; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .team-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .agent-icon { width: 40px; height: 40px; border-radius: 4px; vertical-align: middle; margin-right: 10px; }
        
        /* NEW DYNAMIC WIN/LOSS COLORS */
        .team-win th { border-bottom-color: #00ff64; color: #00ff64; }
        .team-loss th { border-bottom-color: #ff4655; color: #ff4655; }

        .loader { text-align: center; padding: 50px; color: #ffaa00; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>
    <div class="bg-waves" aria-hidden="true"></div>
        <nav>
            <div class="container">
                <a href="index.html" class="nav-logo">
                    <img src="images/LogoTransparent.png" alt="" class="nav-logo-img" width="60" height="60" decoding="async">
                    <span class="nav-logo-text">FRED</span>
                </a>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="matches.html">Matchs</a></li>
                    <li><a href="premier.html" class="nav-active">Premier</a></li> <li><a href="radio.html">Radio</a></li>
                    <li><a href="betting.html">Betting</a></li> 
                    <li><a href="packs.html">Packs</a></li>
                    <li><a href="inventory.html">Inventaire</a></li>
                    <li><a href="catalog.html">Catalogue</a></li>
                    <li><a href="leaderboard.html">Classement</a></li>
                </ul>

                <div id="authContainer" style="margin-left: 2rem; display: flex; align-items: center;">
                    <a id="discordLoginBtn" class="login-btn" style="cursor: pointer;">Login with Discord</a>
                </div>
            </div>
        </nav>
        
        <header class="page-hero fade-in">
            <div>
                <h1>PREMIER LEAGUE TRACKER</h1>
            </div>
        </header>

    <section class="matches-section" aria-labelledby="premier-history-heading">
        <div class="container">
            <h2 id="premier-history-heading" class="section-title">Official Match History</h2>
            
            <div class="premier-container">
                <div class="match-list-panel" id="matchList">
                    <div class="loader">Fetching Premier Data...</div>
                </div>

                <div class="scoreboard-panel" id="scoreboardPanel">
                    </div>
            </div>
            
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-logo">
                <img src="images/LogoTransparent.png" alt="" class="footer-logo-img" width="50" height="50" decoding="async">
                <span class="footer-logo-text">FREDERIC FANCLUB</span>
            </div>
            <div class="footer-content">
                © 2026 FRED Esports. Sharks in the Game.
            </div>
        </div>
    </footer>

</body>
</html>
