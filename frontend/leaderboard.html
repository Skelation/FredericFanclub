<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboards - FRED Fanclub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .leaderboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 40px;
        }

        @media (max-width: 800px) {
            .leaderboard-grid { grid-template-columns: 1fr; }
        }

        .board-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .board-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
        }

        .board-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            transition: transform 0.2s;
        }

        .board-row:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank-number {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            width: 30px;
            text-align: center;
            color: rgba(255,255,255,0.3);
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #333;
        }

        .player-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }

        .player-score {
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            color: #00d4ff;
        }

        .season-tab {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 25px; border-radius: 30px; cursor: pointer;
            font-family: 'Orbitron', sans-serif; font-size: 1rem; transition: all 0.3s;
        }
        .season-tab:hover { background: rgba(255,255,255,0.1); }
        .season-tab.active { background: #b489ff; color: #000; border-color: #b489ff; box-shadow: 0 0 15px rgba(180,137,255,0.5); font-weight: bold; }

        /* --- THE TOP 3 PODIUM COLORS --- */
        .rank-1 .rank-number { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        .rank-1 .player-avatar { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-1 .player-name { color: #ffd700; }

        .rank-2 .rank-number { color: #c0c0c0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.8); }
        .rank-2 .player-avatar { border-color: #c0c0c0; }
        .rank-2 .player-name { color: #c0c0c0; }

        .rank-3 .rank-number { color: #cd7f32; text-shadow: 0 0 10px rgba(205, 127, 50, 0.8); }
        .rank-3 .player-avatar { border-color: #cd7f32; }
        .rank-3 .player-name { color: #cd7f32; }

        /* --- BADGES --- */
        .player-badges {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-left: 6px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 0.75rem;
            cursor: default;
            border: 1px solid transparent;
            transition: transform 0.15s;
        }
        .badge:hover { transform: scale(1.25); }
        .badge-bet5  { background: rgba(205,127,50,.2); border-color: #cd7f32; }
        .badge-bet10 { background: rgba(192,192,192,.2); border-color: #c0c0c0; }
        .badge-bet25 { background: rgba(255,215,0,.2);   border-color: #ffd700; }
        .badge-season { background: rgba(180,137,255,.2); border-color: #b489ff; }

        /* --- SHOWCASE CARD --- */
        .player-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .showcase-thumb {
            width: 32px;
            height: 44px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.15);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .showcase-thumb:hover { transform: scale(2.5) translateX(-20px); z-index: 10; position: relative; }

    </style>
<body>
</head>

    <div class="bg-waves" aria-hidden="true"></div>

    <nav>
        <div class="container">
            <a href="index.html" class="nav-logo">
                <img src="images/LogoTransparent.png" alt="" class="nav-logo-img" width="60" height="60">
                <span class="nav-logo-text">FRED</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="matches.html">Matchs</a></li>
                <li><a href="premier.html">Premier</a></li>
                <li><a href="radio.html">Radio</a></li>
                <li><a href="betting.html">Betting</a></li> 
                <li><a href="packs.html">Packs</a></li>
                <li><a href="inventory.html">Inventaire</a></li>
                <li><a href="catalog.html">Catalogue</a></li>
                <li><a href="leaderboard.html" class="nav-active">Classement</a></li>
            </ul>
            <div id="authContainer" style="margin-left: 2rem; display: flex; align-items: center;">

    <header class="page-hero fade-in">
        <div>
            <h1>Hall of Fame</h1>
            <p style="color: #00d4ff; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; margin-top: 10px;">Les plus riches et plus grands collectioneurs</p>
        </div>
    </header>

    <main class="container" style="padding-bottom: 100px;">

        <div id="seasonTabs" style="display: flex; justify-content: center; gap: 15px; margin: 30px 0; flex-wrap: wrap;"></div>

        <div class="leaderboard-grid">

            <div class="board-panel">
                <div class="board-header" style="color: #00ff64; border-color: rgba(0, 255, 100, 0.3);">💰 Les plus Riches</div>
                <div id="tokensList">
                    <p style="text-align: center; color: #888;">Loading data...</p>
                </div>
            </div>

            <div class="board-panel">
                <div id="cardsHeader" class="board-header" style="color: #b489ff; border-color: rgba(180, 137, 255, 0.3);">🃏 Plus grands Collectioneurs</div>
                <div id="cardsList">
                    <p style="text-align: center; color: #888;">Loading data...</p>
                </div>
            </div>

        </div>
    </main>

    <script src="js/site.js"></script>
    <script>
        let tabsBuilt = false;

        const BADGE_META = {
            bet_wins_5:  { cls: 'badge-bet5',  icon: '🎲', title: '5 paris gagnés' },
            bet_wins_10: { cls: 'badge-bet10', icon: '🎯', title: '10 paris gagnés' },
            bet_wins_25: { cls: 'badge-bet25', icon: '👑', title: '25 paris gagnés' },
        };

        function renderBadges(badges) {
            if (!badges || badges.length === 0) return '';
            return '<div class="player-badges">' + badges.map(b => {
                const meta = BADGE_META[b];
                if (meta) return `<span class="badge ${meta.cls}" title="${meta.title}">${meta.icon}</span>`;
                if (b.startsWith('season_complete_')) return `<span class="badge badge-season" title="Saison complétée">🃏</span>`;
                return '';
            }).join('') + '</div>';
        }

        function renderBoard(users, targetElement, suffix) {
            if (!users || users.length === 0) {
                targetElement.innerHTML = `<p style="text-align: center; color: #888;">No players found.</p>`;
                return;
            }
            targetElement.innerHTML = users.map((user, index) => {
                const rank = index + 1;
                const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
                const scoreFormatted = Math.round(user.score).toLocaleString();
                const badgesHtml = renderBadges(user.badges);
                const showcaseHtml = user.showcase_card
                    ? `<img src="${user.showcase_card.image_url}" class="showcase-thumb" title="${user.showcase_card.name} (${user.showcase_card.rarity})" alt="Showcase">`
                    : '';
                return `
                    <div class="board-row ${rankClass}">
                        <div class="player-info">
                            <span class="rank-number">#${rank}</span>
                            <img src="${user.avatar}" class="player-avatar" alt="Avatar">
                            <span class="player-name">${user.username}</span>
                            ${badgesHtml}
                        </div>
                        <div class="player-right">
                            ${showcaseHtml}
                            <span class="player-score">${scoreFormatted} ${suffix}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        async function loadLeaderboard(season) {
            const tokensList = document.getElementById('tokensList');
            const cardsList = document.getElementById('cardsList');
            const cardsHeader = document.getElementById('cardsHeader');

            try {
                const url = season
                    ? `${getApiBase()}/api/leaderboard?season=${encodeURIComponent(season)}`
                    : `${getApiBase()}/api/leaderboard`;
                const res = await fetch(url, { credentials: 'include' });
                if (!res.ok) throw new Error();
                const data = await res.json();

                // Build season tabs once, using the list returned by the server
                if (!tabsBuilt && data.available_seasons && data.available_seasons.length > 0) {
                    tabsBuilt = true;
                    const tabsContainer = document.getElementById('seasonTabs');
                    data.available_seasons.forEach(s => {
                        const btn = document.createElement('button');
                        btn.className = 'season-tab' + (s === data.season ? ' active' : '');
                        btn.textContent = s;
                        btn.onclick = () => {
                            document.querySelectorAll('.season-tab').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            loadLeaderboard(s);
                        };
                        tabsContainer.appendChild(btn);
                    });
                }

                // Update cards board header to reflect active season
                if (cardsHeader && data.season) {
                    cardsHeader.textContent = `🃏 ${data.season} — Collectioneurs`;
                }

                renderBoard(data.top_tokens, tokensList, "FT");
                renderBoard(data.top_cards, cardsList, "Cards");

            } catch (err) {
                tokensList.innerHTML = `<p style="text-align: center; color: #ff4655;">Error loading leaderboard.</p>`;
                cardsList.innerHTML = `<p style="text-align: center; color: #ff4655;">Error loading leaderboard.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => loadLeaderboard(null));
    </script>
</body>
