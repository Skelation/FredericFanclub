<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboards - FRED Fanclub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .leaderboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 40px;
        }

        @media (max-width: 800px) {
            .leaderboard-grid { grid-template-columns: 1fr; }
        }

        .board-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .board-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
        }

        .board-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            transition: transform 0.2s;
        }

        .board-row:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank-number {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            width: 30px;
            text-align: center;
            color: rgba(255,255,255,0.3);
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #333;
        }

        .player-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }

        .player-score {
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            color: #00d4ff;
        }

        /* --- THE TOP 3 PODIUM COLORS --- */
        .rank-1 .rank-number { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        .rank-1 .player-avatar { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .rank-1 .player-name { color: #ffd700; }
        
        .rank-2 .rank-number { color: #c0c0c0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.8); }
        .rank-2 .player-avatar { border-color: #c0c0c0; }
        .rank-2 .player-name { color: #c0c0c0; }

        .rank-3 .rank-number { color: #cd7f32; text-shadow: 0 0 10px rgba(205, 127, 50, 0.8); }
        .rank-3 .player-avatar { border-color: #cd7f32; }
        .rank-3 .player-name { color: #cd7f32; }

    </style>
<body>
</head>
    <script>
        // Set this to true on launch day!
        const IS_LAUNCHED = true; 

        if (!IS_LAUNCHED) {
            document.write(`
                <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #020a13; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif;">
                    <img src="images/LogoTransparent.png" style="width: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 20px #00d4ff);">
                    <h1 style="color: white; font-size: 3rem; text-transform: uppercase; letter-spacing: 5px; margin: 0;">System Encrypted</h1>
                    <p style="color: #00d4ff; font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; margin-top: 10px;">The FRED Trading Card Protocol unlocks in a few days.</p>
                    <a href="index.html" style="margin-top: 30px; padding: 10px 30px; background: #ff4655; color: white; text-decoration: none; font-weight: bold; border-radius: 4px;">RETURN TO BASE</a>
                </div>
            `);
            window.stop(); // Instantly stops the rest of the HTML/JS from loading!
        }
    </script>
    <div class="bg-waves" aria-hidden="true"></div>

    <nav>
        <div class="container">
            <a href="index.html" class="nav-logo">
                <img src="images/LogoTransparent.png" alt="" class="nav-logo-img" width="60" height="60">
                <span class="nav-logo-text">FRED</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="matches.html">Matchs</a></li>
                <li><a href="radio.html">Radio</a></li>
                <li><a href="betting.html">Betting</a></li> 
                <li><a href="packs.html">Packs</a></li>
                <li><a href="inventory.html">Inventaire</a></li>
                <li><a href="catalog.html">Catalogue</a></li>
                <li><a href="leaderboard.html" class="nav-active">Classement</a></li>
            </ul>
            <div id="authContainer" style="margin-left: 2rem; display: flex; align-items: center;">
                <a id="discordLoginBtn" class="login-btn" style="cursor: pointer;">Login with Discord</a>
            </div>
        </div>
    </nav>

    <header class="page-hero fade-in">
        <div>
            <h1>Hall of Fame</h1>
            <p style="color: #00d4ff; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; margin-top: 10px;">Les plus riches et plus grands collectioneurs</p>
        </div>
    </header>

    <main class="container" style="padding-bottom: 100px;">
        <div class="leaderboard-grid">
            
            <div class="board-panel">
                <div class="board-header" style="color: #00ff64; border-color: rgba(0, 255, 100, 0.3);">💰 Les plus Riches</div>
                <div id="tokensList">
                    <p style="text-align: center; color: #888;">Loading data...</p>
                </div>
            </div>

            <div class="board-panel">
                <div class="board-header" style="color: #b489ff; border-color: rgba(180, 137, 255, 0.3);">🃏 Plus grands Collectioneurs</div>
                <div id="cardsList">
                    <p style="text-align: center; color: #888;">Loading data...</p>
                </div>
            </div>

        </div>
    </main>

    <script src="js/site.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tokensList = document.getElementById('tokensList');
            const cardsList = document.getElementById('cardsList');

            try {
                // Fetch the Leaderboard data
                const res = await fetch(`${getApiBase()}/api/leaderboard`, { credentials: 'include' });
                if (!res.ok) throw new Error("Failed to load leaderboards");
                const data = await res.json();

                // Helper function to render a board
                function renderBoard(users, targetElement, suffix) {
                    if (!users || users.length === 0) {
                        targetElement.innerHTML = `<p style="text-align: center; color: #888;">No players found.</p>`;
                        return;
                    }

                    targetElement.innerHTML = users.map((user, index) => {
                        const rank = index + 1;
                        let rankClass = '';
                        // Apply special glowing classes for the Top 3
                        if (rank === 1) rankClass = 'rank-1';
                        else if (rank === 2) rankClass = 'rank-2';
                        else if (rank === 3) rankClass = 'rank-3';

                        // Format the number to look clean (e.g. 1000 instead of 1000.0)
                        const scoreFormatted = Math.round(user.score).toLocaleString();

                        return `
                            <div class="board-row ${rankClass}">
                                <div class="player-info">
                                    <span class="rank-number">#${rank}</span>
                                    <img src="${user.avatar}" class="player-avatar" alt="Avatar">
                                    <span class="player-name">${user.username}</span>
                                </div>
                                <span class="player-score">${scoreFormatted} ${suffix}</span>
                            </div>
                        `;
                    }).join('');
                }

                // Render both boards
                renderBoard(data.top_tokens, tokensList, "FT");
                renderBoard(data.top_cards, cardsList, "Cards");

            } catch (err) {
                tokensList.innerHTML = `<p style="text-align: center; color: #ff4655;">Error loading leaderboard.</p>`;
                cardsList.innerHTML = `<p style="text-align: center; color: #ff4655;">Error loading leaderboard.</p>`;
            }
        });
    </script>
</body>
</html>
