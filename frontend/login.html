<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRED — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050810;
      font-family: 'Rajdhani', sans-serif;
      color: #e0e6ff;
    }

    .card {
      background: #0d1428;
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 12px;
      padding: 56px 48px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 0 60px rgba(0, 212, 255, 0.06);
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.4rem;
      font-weight: 900;
      color: #00d4ff;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(224, 230, 255, 0.5);
      letter-spacing: 0.06em;
      margin-bottom: 40px;
    }

    .error-box {
      background: rgba(255, 70, 85, 0.1);
      border: 1px solid rgba(255, 70, 85, 0.35);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 28px;
      font-size: 0.92rem;
      color: #ff7080;
      line-height: 1.5;
    }

    .login-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #5865F2;
      color: #fff;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 14px 32px;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .login-btn:hover { background: #4752c4; transform: translateY(-1px); }
    .login-btn:active { transform: translateY(0); }

    .login-btn svg {
      flex-shrink: 0;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: rgba(224, 230, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FRED</div>
    <div class="subtitle">FREDERIC FANCLUB</div>

    <div class="error-box" id="error-box" style="display:none"></div>

    <a class="login-btn" href="/api/auth/discord">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.63 1.34A18.17 18.17 0 0 0 14.01 0c-.19.34-.4.8-.55 1.16a16.77 16.77 0 0 0-5 0A12.1 12.1 0 0 0 7.9 0 18.2 18.2 0 0 0 3.27 1.35 19.26 19.26 0 0 0 0 13.01a18.3 18.3 0 0 0 5.58 2.83c.45-.62.85-1.28 1.19-1.97a11.87 11.87 0 0 1-1.87-.91l.46-.36a13.05 13.05 0 0 0 11.28 0l.46.36c-.6.36-1.22.67-1.87.91.34.7.74 1.35 1.19 1.97A18.24 18.24 0 0 0 22 13.01 19.27 19.27 0 0 0 18.63 1.34ZM7.35 10.67c-1.08 0-1.96-1-1.96-2.22s.86-2.23 1.96-2.23c1.1 0 1.98 1 1.96 2.23 0 1.22-.87 2.22-1.96 2.22Zm7.3 0c-1.08 0-1.96-1-1.96-2.22s.86-2.23 1.96-2.23c1.1 0 1.98 1 1.96 2.23 0 1.22-.86 2.22-1.96 2.22Z" fill="white"/>
      </svg>
      Login with Discord
    </a>

    <div class="footer">Members only &mdash; invite required</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const box = document.getElementById('error-box');
    if (params.get('error') === 'not_registered') {
      box.textContent = 'Your Discord account is not registered. This site is invite-only — contact an admin to get access.';
      box.style.display = 'block';
    } else if (params.get('error') === 'forbidden') {
      box.textContent = 'Access denied. This page is restricted.';
      box.style.display = 'block';
    }
  </script>
</body>
</html>
