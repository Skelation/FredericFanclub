<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRED Prediction Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    </head>
<body>
        <script>
        // Set this to true on launch day!
        const IS_LAUNCHED = true; 

        if (!IS_LAUNCHED) {
            document.write(`
                <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #020a13; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif;">
                    <img src="images/LogoTransparent.png" style="width: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 20px #00d4ff);">
                    <h1 style="color: white; font-size: 3rem; text-transform: uppercase; letter-spacing: 5px; margin: 0;">System Encrypted</h1>
                    <p style="color: #00d4ff; font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; margin-top: 10px;">The FRED Trading Card Protocol unlocks in a few days.</p>
                    <a href="index.html" style="margin-top: 30px; padding: 10px 30px; background: #ff4655; color: white; text-decoration: none; font-weight: bold; border-radius: 4px;">RETURN TO BASE</a>
                </div>
            `);
            window.stop(); // Instantly stops the rest of the HTML/JS from loading!
        }
    </script>
    <div class="bg-waves" aria-hidden="true"></div>
    
<nav>
        <div class="container">
                <a href="index.html" class="nav-logo">
                <img src="images/LogoTransparent.png" alt="" class="nav-logo-img" width="60" height="60" decoding="async">
                <span class="nav-logo-text">FRED</span>
            </a>
            
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="matches.html">Matchs</a></li>
                <li><a href="premier.html">Premier</a></li>
                <li><a href="radio.html">Radio</a></li>
                <li><a href="betting.html">Betting</a></li> 
                <li><a href="packs.html" class="nav-active">Packs</a></li>
                <li><a href="inventory.html">Inventaire</a></li>
                <li><a href="catalog.html">Catalogue</a></li>
                <li><a href="leaderboard.html">Classement</a></li>
            </ul>

            <div id="authContainer" style="margin-left: 2rem; display: flex; align-items: center;">
                    <a id="discordLoginBtn" class="login-btn" style="cursor: pointer;">Login with Discord</a>
            </div>
        </div>
    </nav>

    <header class="page-hero fade-in">
        <div>
            <h1>Case</h1>
        </div>
    </header>
        <main class="container" style="padding: 60px 0 100px 0;">

            <div class="unboxing-wrapper">
                <div class="target-line"></div>

                <div class="spinner-window">
                    <div id="spinnerTrack" class="spinner-track">
                    </div>
                </div>
            </div>

            <div class="unboxing-controls" style="text-align: center; margin-top: 30px;">
                <div class="unboxing-controls" style="text-align: center; margin-top: 30px;">
                    <p id="packSeasonLabel" style="font-family: 'Orbitron', sans-serif; font-size: 0.75rem; letter-spacing: 3px; color: #00d4ff; text-transform: uppercase; margin-bottom: 10px; opacity: 0.8;"></p>
                    <button id="btnOpenCase" class="open-case-btn">
                        OPEN CASE <span class="price-tag">(250 FT)</span>
                    </button>
                    <div id="dailyRewardBox" style="text-align: center; margin-top: 40px; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 8px; border: 1px solid rgba(43, 201, 126, 0.3);">
                        <h3 style="font-family: 'Orbitron', sans-serif; margin-bottom: 15px; color: white;">Daily Supply Drop</h3>
                        <button id="btnDailyReward" onclick="claimDailyReward()" style="
                            background: #2bc97e; color: #000; font-family: 'Orbitron', sans-serif; font-weight: 900; 
                            font-size: 1.2rem; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; 
                            box-shadow: 0 0 20px rgba(43, 201, 126, 0.4); transition: transform 0.2s;">
                            CLAIM 250 FT
                        </button>
                        <p id="dailyMessage" style="margin-top: 15px; font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; color: #00d4ff;"></p>
                    </div>
                    <div style="max-width: 800px; margin: 0 auto 40px auto; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 20px;">
                            <h2 style="font-family: 'Orbitron', sans-serif; color: white; margin: 0;">Daily Operations</h2>
                            <span id="resetTimer" style="font-family: 'Rajdhani', sans-serif; color: #ffaa00; font-size: 1.1rem; font-weight: bold;">Loading timer...</span>
                        </div>

                        <div id="missionsList" style="display: flex; flex-direction: column; gap: 15px;">
                            <p style="text-align: center; color: #888; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem;">Decrypting today's targets...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="winnerReveal" style="display: none; text-align: center; margin-top: 30px;">
                <h2 style="color: white; font-family: 'Orbitron', sans-serif;">YOU PULLED:</h2>
                <div id="winnerCardDisplay"></div>
            </div>
        </main>

        <footer>
        <div class="container">
            <div class="footer-logo">
                <img src="images/LogoTransparent.png" alt="" class="footer-logo-img" width="50" height="50" decoding="async">
                <span class="footer-logo-text">FREDERIC FANCLUB</span>
            </div>
            <div class="footer-content">
                © 2026 FRED Esports. Sharks in the Game.
            </div>
        </div>
    </footer>

    <script src="js/site.js?v=pack9-bp"></script>
    <script>
        fetch(getApiBase() + '/api/packs/season', { credentials: 'include' })
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById('packSeasonLabel');
                if (el && data.season) el.textContent = data.season + ' Packs';
            })
            .catch(() => {});
    </script>
</body>
</html>
