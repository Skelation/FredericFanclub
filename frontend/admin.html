<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fred Admin Panel</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; padding: 50px; }
        .admin-box { background: #222; padding: 30px; border-radius: 8px; max-width: 400px; }
        input, select, button { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
        button { background: #00d4ff; color: #000; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>Add Trading Card</h2>
        
        <label>Admin Password:</label>
        <input type="password" id="adminToken" placeholder="Enter FRED_ADMIN_TOKEN">

        <label>Card Name:</label>
        <input type="text" id="cardName" placeholder="e.g. Graussbyt Base">

        <label>Rarity:</label>
        <select id="cardRarity">
            <option value="iron">Iron</option>
            <option value="bronze">Bronze</option>
            <option value="diamond">Diamond</option>
            <option value="ascendant">Ascendant</option>
            <option value="immortal">Immortal</option>
            <option value="radiant">Radiant</option>
        </select>

            <label>Season:</label>
            <input type="text" id="cardSeason" placeholder="e.g. Season 1" value="Season 1">
        <label>Image URL:</label>
        <input type="text" id="cardImage" placeholder="/images/cards/graussbyt.png">

        <button onclick="addCard()">Add to Database</button>
        <p id="statusMsg"></p>
            <hr style="border-color: #444; margin: 30px 0;">

            <h2>Central Bank (Mint Tokens)</h2>

            <label>User Discord ID:</label>
            <input type="text" id="targetDiscordId" placeholder="e.g. 123456789012345678">

            <label>Amount to Give (Can be negative to remove!):</label>
            <input type="number" id="tokenAmount" placeholder="5000">

            <button onclick="giveTokens()" style="background: #2bc97e;">Grant Fredtokens</button>
            <p id="tokenStatusMsg"></p>
            <hr style="border-color: #444; margin: 30px 0;">

        <h2>Manage Cards (Delete)</h2>
        <button onclick="fetchAdminCards()" style="background: #b489ff;">Load Card Catalog</button>
        
        <div id="adminCardList" style="margin-top: 15px; max-height: 300px; overflow-y: auto;"></div>
        
        <p id="deleteStatusMsg"></p>
    </div>

        <script>
        function getApiBase() {
            if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                return "http://localhost:8080";
            }
            return "https://api.fredericfan.club";
        }

        async function addCard() {
            const btn = document.querySelector('button');
            const msg = document.getElementById('statusMsg');
            btn.innerText = "Loading...";
            msg.innerText = "";

            try {
                const token = document.getElementById('adminToken').value;
                const data = {
                    name: document.getElementById('cardName').value,
                    rarity: document.getElementById('cardRarity').value,
                    image_url: document.getElementById('cardImage').value
                };

                const response = await fetch(`${getApiBase()}/api/admin/cards`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Token': token
                    },
                    body: JSON.stringify(data)
                });

                // First, check if the response is actually JSON before trying to parse it!
                const contentType = response.headers.get("content-type");
                let result;
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    result = await response.json();
                } else {
                    // If it's not JSON, grab the plain text so we can see the error
                    const textError = await response.text();
                    throw new Error(`Server returned non-JSON: ${textError}`);
                }
                
                if (response.ok) {
                    msg.style.color = "lime";
                    msg.innerText = "Success! Card ID: " + result.card_id;
                    document.getElementById('cardName').value = ''; 
                } else {
                    msg.style.color = "red";
                    msg.innerText = "Error: " + (result.error || "Unknown server error");
                }
            } catch (error) {
                console.error(error);
                msg.style.color = "red";
                msg.innerText = "Fetch Error: " + error.message;
            } finally {
                btn.innerText = "Add to Database";
            }
        }

        async function giveTokens() {
            const token = document.getElementById('adminToken').value;
            const data = {
                discord_id: document.getElementById('targetDiscordId').value,
                amount: parseInt(document.getElementById('tokenAmount').value)
            };

            const response = await fetch(`${getApiBase()}/api/admin/tokens`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': token
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const msg = document.getElementById('tokenStatusMsg');
            
            if (response.ok) {
                msg.style.color = "lime";
                msg.innerText = result.message;
                document.getElementById('targetDiscordId').value = ''; 
                document.getElementById('tokenAmount').value = '';
            } else {
                msg.style.color = "red";
                msg.innerText = "Error: " + result.error;
            }
        }
        async function fetchAdminCards() {
            // Reusing the catalog route to get the master list of cards!
            const res = await fetch(`${getApiBase()}/api/catalog`);
            const list = document.getElementById('adminCardList');
            
            if (res.ok) {
                const cards = await res.json();
                
                if (!cards || cards.length === 0) {
                    list.innerHTML = "<p style='color: #888;'>No cards found.</p>";
                    return;
                }

                // Build a nice UI list with a red Delete button for each card
                list.innerHTML = cards.map(c => `
                    <div style="display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px; margin-bottom: 5px; border-radius: 4px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <img src="${c.image_url}" style="width: 30px; height: 42px; object-fit: cover; border-radius: 2px;">
                            <div>
                                <strong style="color: white;">[#${c.id}] ${c.name}</strong> <br>
                                <span style="font-size: 0.8rem; color: #aaa; text-transform: uppercase;">${c.rarity}</span>
                            </div>
                        </div>
                        <button onclick="deleteCard(${c.id})" style="background: #ff4655; color: white; padding: 5px 10px; width: auto; margin: 0; font-size: 0.9rem;">Delete</button>
                    </div>
                `).join('');
            }
        }

        async function deleteCard(cardId) {
            // Extra safety check so you don't accidentally click it
            if (!confirm(`Are you SURE you want to delete Card #${cardId}?\nThis will destroy it and remove it from every player's inventory permanently.`)) return;

            const token = document.getElementById('adminToken').value;
            const msg = document.getElementById('deleteStatusMsg');

            const res = await fetch(`${getApiBase()}/api/admin/delete-card`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': token
                },
                body: JSON.stringify({ card_id: cardId })
            });

            const result = await res.json();
            
            if (res.ok) {
                msg.style.color = "lime";
                msg.innerText = result.message;
                fetchAdminCards(); // Refresh the list so the deleted card disappears
            } else {
                msg.style.color = "red";
                msg.innerText = "Error: " + result.error;
            }
        }
        const data = {
                    name: document.getElementById('cardName').value,
                    rarity: document.getElementById('cardRarity').value,
                    image_url: document.getElementById('cardImage').value,
                    season: document.getElementById('cardSeason').value // NEW
                };
    </script>
    </body>
</html>
